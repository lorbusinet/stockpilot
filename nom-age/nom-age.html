<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nom et âge</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f4f6fb;
      color: #222;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      margin: 0;
    }
    .carte {
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 400px;
    }
    h1 { margin-top: 0; font-size: 1.5rem; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin-top: 4px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #4f6ef7;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #3b57d6; }
    #resultat {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      background: #eef2ff;
      font-size: 1.1rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="carte">
    <h1>Présente-toi</h1>
    <form id="formulaire">
      <label for="nom">Ton nom</label>
      <input type="text" id="nom" required>

      <label for="age">Ton âge</label>
      <input type="number" id="age" min="0" max="150" required>

      <button type="submit">Afficher</button>
    </form>
    <div id="resultat"></div>
  </div>

  <script>
    document.getElementById("formulaire").addEventListener("submit", function (e) {
      e.preventDefault();
      const nom = document.getElementById("nom").value.trim();
      const age = document.getElementById("age").value;
      const resultat = document.getElementById("resultat");
      resultat.textContent = "Bonjour " + nom + ", tu as " + age + " ans !";
      resultat.style.display = "block";
    });
  </script>
</body>
</html>
